<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Storage warning: role="alert" so screen readers announce it when it appears -->
    <p id="storage-warning" class="banner banner--error hidden" role="alert"></p>

    <!-- Header: app title + total balance -->
    <header id="header">
      <h1>Expenses Tracker</h1>
      <!-- dl/dt/dd makes the label-value relationship explicit to assistive tech -->
      <dl id="balance-display">
        <dt id="balance-label">Total Balance</dt>
        <dd id="balance-amount">$0.00</dd>
      </dl>
    </header>

    <main id="main">

      <!-- Input Form section -->
      <section id="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="field">
            <label for="item-name">Item Name</label>
            <input
              id="item-name"
              type="text"
              maxlength="100"
              autocomplete="off"
              aria-describedby="err-item-name"
              aria-required="true"
            />
            <span id="err-item-name" class="field__error hidden" role="alert"></span>
          </div>
          <div class="field">
            <label for="amount">Amount ($)</label>
            <input
              id="amount"
              type="number"
              min="0.01"
              max="999999999.99"
              step="0.01"
              aria-describedby="err-amount"
              aria-required="true"
            />
            <span id="err-amount" class="field__error hidden" role="alert"></span>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="Shopping">Shopping</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <button type="submit" id="add-btn">Add Transaction</button>
        </form>
      </section>

      <!-- Transaction List section -->
      <section id="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transaction History</h2>

        <!-- View toggle tabs -->
        <div class="view-tabs" role="tablist" aria-label="Transaction view">
          <button
            type="button"
            id="tab-all"
            class="view-tab view-tab--active"
            role="tab"
            aria-selected="true"
            aria-controls="all-transactions-container"
          >All Transactions</button>
          <button
            type="button"
            id="tab-monthly"
            class="view-tab"
            role="tab"
            aria-selected="false"
            aria-controls="monthly-summary-container"
          >Monthly Summary</button>
        </div>

        <!-- Default view: transaction list -->
        <div id="all-transactions-container" role="tabpanel" aria-labelledby="tab-all">
          <ul id="transaction-list" aria-label="All transactions"></ul>
          <p id="empty-message" class="hidden">No transactions recorded yet.</p>
        </div>

        <!-- Monthly summary view (hidden by default) -->
        <div
          id="monthly-summary-container"
          class="hidden"
          role="tabpanel"
          aria-labelledby="tab-monthly"
        ></div>
      </section>

      <!-- Chart section -->
      <section id="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div id="chart-container">
          <!-- role="img" + aria-label gives the canvas an accessible name -->
          <canvas
            id="spending-chart"
            role="img"
            aria-label="Pie chart showing spending breakdown by category"
          ></canvas>
          <p id="chart-empty-message" class="hidden">No spending data available.</p>
          <p id="chart-error-message" class="hidden">Chart unavailable — Chart.js failed to load.</p>
        </div>
      </section>

    </main>
  </div>

  <!-- Chart.js from CDN -->
  <script>window._chartAvailable = true;</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4" onerror="window._chartAvailable = false;"></script>

  <!-- Application -->
  <script src="js/app.js"></script>
</body>
</html>
